services:
  accounts:
    image: "nileshsinha1731/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - nileshsinha1731

  loans:
    image: "nileshsinha1731/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - nileshsinha1731

  cards:
    image: "nileshsinha1731/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - nileshsinha1731

networks:
  nileshsinha1731:
    driver: "bridge"